<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6F"
     crossorigin="anonymous">
</head>
<body>
    <div class="container m-4">
    <div class="row">
    <div class="col-md-3"></div>
    <div class="col-md-6">
        
<h4 class="text-center text-success mb-3">Registration Here for an Event</h4>
    <div class="card bg-light p-3 shadow-sm">
    <div class="card-body">
        <form action="">
            <div class="mb-3">
             <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" 
            placeholder="Enter Your first name" required>
            </div>
            <div class="mb-3">
            <label for="lastname" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastname" 
            placeholder="Enter Your last name" required>
            </div>
            <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" 
            placeholder="Enter Your email" required>
            </div>
            <div class="mb-3">
            <label for="Password" class="form-label">Password</label>
            <input type="password" class="form-control" id="Password" 
            placeholder="Enter Your password" required>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" 
            placeholder="Confirm Your password" required>
        </div>
        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-control" id="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="checkbox" required>
            <label class="form-check-label" for="checkbox">I agree to the terms and
         conditions</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

</body>
</html>
